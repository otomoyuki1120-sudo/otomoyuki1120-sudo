name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Gitleaks
        run: |
          file=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$file"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $file" | sha256sum -c -
          tar -xzf "$file" -C "$RUNNER_TEMP" gitleaks
          rm "$file"
      - name: Scan repository files
        run: '"$RUNNER_TEMP/gitleaks" dir --redact .'
